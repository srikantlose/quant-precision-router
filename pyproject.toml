[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14.4",
    "patsy>=0.5.6",
    "sentence-transformers>=5.0",
    "huggingface-hub>=0.35",
    "gguf>=0.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "plotly>=5.24",
    "streamlit>=1.40",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon",
    "gpu: needs llama-server and models",
]
addopts = "-m 'not docker and not gpu'"
